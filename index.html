<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07182a">
  <meta name="description" content="裕信汽車服務部的儀表板與管理系統入口平台">
  <title>裕信汽車｜服務部管理平台</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%2307182a'/%3E%3Cpath d='M15 17h9l8 14 8-14h9L36 40v9h-8v-9z' fill='%23fff'/%3E%3Cpath d='M46 13h6v18h-6z' fill='%23d7283f'/%3E%3C/svg%3E">
  <style>
    :root{--navy:#07182a;--navy2:#102a43;--graphite:#202a35;--muted:#65717d;--fog:#f3f5f7;--white:#fff;--line:#dce2e7;--red:#c92138;--red2:#e5384f;--shadow:0 14px 36px rgba(6,24,42,.1);--radius:18px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--fog);color:var(--graphite);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.6}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}
    .topbar{position:sticky;top:0;z-index:20;background:rgba(7,24,42,.96);backdrop-filter:blur(14px);color:#fff;border-bottom:1px solid rgba(255,255,255,.1)}.topbar-inner{max-width:1440px;margin:auto;min-height:82px;padding:14px 32px;display:flex;gap:28px;align-items:center}.brand{display:flex;align-items:center;gap:13px;min-width:max-content}.brandmark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#fff;color:var(--navy);font-size:20px;font-weight:900;position:relative;box-shadow:inset 0 0 0 1px rgba(7,24,42,.08)}.brandmark:after{content:"";position:absolute;right:-3px;top:7px;width:5px;height:18px;background:var(--red);border-radius:2px}.brand-copy strong{display:block;font-size:17px;letter-spacing:.08em}.brand-copy span{display:block;color:#9fb0bf;font-size:12px;letter-spacing:.14em}.search{max-width:580px;flex:1;margin-left:auto;position:relative}.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#9fb0bf}.search input{width:100%;height:46px;padding:0 48px 0 46px;border:1px solid rgba(255,255,255,.16);border-radius:12px;color:#fff;background:rgba(255,255,255,.08);outline:0}.search input:focus{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.12)}.search input::placeholder{color:#a8b7c4}.shortcut{position:absolute;right:13px;top:50%;transform:translateY(-50%);border:1px solid rgba(255,255,255,.18);border-radius:5px;padding:1px 6px;color:#a8b7c4;font-size:12px}.manage-btn{border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;border-radius:11px;height:44px;padding:0 16px;cursor:pointer;font-weight:700}.manage-btn:hover{background:#fff;color:var(--navy)}
    main{max-width:1440px;margin:auto;padding:42px 32px 80px}.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;margin-bottom:26px}.eyebrow{color:var(--red);font-weight:800;letter-spacing:.16em;font-size:13px}.intro h1{margin:5px 0 4px;font-size:clamp(28px,3vw,42px);line-height:1.25;color:var(--navy);letter-spacing:-.02em}.intro p{margin:0;color:var(--muted)}.overview-note{text-align:right;color:var(--muted);font-size:14px}.overview-note b{color:var(--navy);font-size:24px;display:block}
    .categories{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.category{appearance:none;text-align:left;border:1px solid var(--line);background:var(--white);padding:22px 20px 20px;border-radius:var(--radius);min-height:228px;cursor:pointer;position:relative;transition:.22s ease;box-shadow:0 3px 10px rgba(6,24,42,.03);overflow:hidden}.category:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent,var(--red));opacity:.85}.category:hover,.category.active{transform:translateY(-5px);border-color:#b9c4ce;box-shadow:var(--shadow)}.category.active{background:var(--navy);color:#fff}.category.active h3,.category.active .icon{color:#fff}.category.active p,.category.active .count{color:#b8c7d3}.category.active .enter{color:#fff}.icon{width:45px;height:45px;display:grid;place-items:center;border-radius:12px;background:#edf1f4;color:var(--navy);margin-bottom:28px}.category.active .icon{background:rgba(255,255,255,.12)}.category h3{margin:0 0 8px;color:var(--navy);font-size:17px;line-height:1.35}.category p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}.category-foot{position:absolute;bottom:17px;left:20px;right:18px;display:flex;align-items:center;justify-content:space-between}.count{color:#89949e;font-size:12px}.enter{color:var(--navy);font-size:13px;font-weight:800}
    .section{margin-top:38px}.section-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;gap:18px}.section-heading h2{margin:0;color:var(--navy);font-size:21px}.section-heading p{margin:2px 0 0;color:var(--muted);font-size:14px}.text-btn{border:0;background:transparent;color:var(--red);font-weight:800;cursor:pointer;padding:8px}.entry-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.entry-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;min-height:190px;display:flex;flex-direction:column;transition:.2s ease}.entry-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#c4ccd3}.entry-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.entry-badge{font-size:12px;font-weight:800;color:#53606c;background:#edf1f4;border-radius:6px;padding:4px 8px}.favorite{width:36px;height:36px;border:0;background:transparent;border-radius:9px;cursor:pointer;color:#97a1aa;display:grid;place-items:center}.favorite:hover{background:#f4f5f6}.favorite.on{color:#d99b12}.favorite svg{fill:currentColor}.entry-card h3{margin:18px 0 6px;color:var(--navy);font-size:17px}.entry-card p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}.entry-actions{margin-top:auto;padding-top:22px;display:flex;justify-content:space-between;align-items:center;gap:10px}.open-btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:0;background:var(--navy);color:#fff;border-radius:10px;min-height:40px;padding:8px 15px;font-weight:800;font-size:14px;cursor:pointer}.open-btn:hover{background:#163854}.open-btn.pending{background:#e8ecef;color:#77828c;cursor:default}.edit-mini{border:0;background:transparent;color:#7d8790;cursor:pointer;font-size:13px}.project-meta{margin-top:16px}.meta-row{display:flex;justify-content:space-between;color:#65717d;font-size:13px}.progress{height:7px;border-radius:99px;background:#e7ebee;overflow:hidden;margin-top:7px}.progress span{display:block;height:100%;background:var(--red);border-radius:inherit}.status{font-weight:800}.status.done{color:#2f7d5d}.status.late{color:var(--red)}
    .empty{grid-column:1/-1;background:#fff;border:1px dashed #c8d0d7;border-radius:16px;text-align:center;padding:42px 20px;color:var(--muted)}.empty strong{display:block;color:var(--navy);font-size:18px;margin-bottom:4px}.hidden{display:none!important}
    dialog{width:min(600px,calc(100% - 28px));border:0;border-radius:20px;padding:0;box-shadow:0 30px 90px rgba(0,0,0,.3);color:var(--graphite)}dialog::backdrop{background:rgba(4,16,28,.66);backdrop-filter:blur(3px)}.modal-head{padding:23px 25px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-head h2{margin:0;color:var(--navy);font-size:21px}.close{border:0;background:#eff2f4;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:20px}.form{padding:24px 25px}.field{display:grid;gap:6px;margin-bottom:16px}.field label{font-weight:800;color:#36434e;font-size:14px}.field input,.field select,.field textarea{width:100%;border:1px solid #cdd4da;border-radius:10px;padding:11px 12px;outline:0;background:#fff}.field textarea{min-height:82px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#667d91;box-shadow:0 0 0 3px rgba(16,42,67,.08)}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.project-fields{border-top:1px solid var(--line);padding-top:14px}.modal-foot{display:flex;justify-content:space-between;align-items:center;padding-top:8px;gap:12px}.right-actions{display:flex;gap:10px}.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer}.btn.primary{background:var(--navy);color:#fff}.btn.ghost{background:#edf1f4;color:var(--graphite)}.btn.danger{background:transparent;color:var(--red);padding-left:0}.toast{position:fixed;right:24px;bottom:24px;z-index:50;background:var(--navy);color:#fff;padding:12px 17px;border-radius:11px;box-shadow:var(--shadow);opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}
    @media(max-width:1100px){.categories{grid-template-columns:repeat(3,1fr)}.entry-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.topbar-inner{padding:12px 18px;flex-wrap:wrap;gap:12px}.brand{flex:1}.brand-copy span{display:none}.search{order:3;flex-basis:100%;max-width:none}.manage-btn{padding:0 12px}.shortcut{display:none}main{padding:28px 18px 60px}.intro{align-items:flex-start}.overview-note{display:none}.categories{display:flex;overflow:auto;scroll-snap-type:x mandatory;padding:4px 2px 16px;margin:0 -18px;padding-left:18px}.category{min-width:245px;min-height:205px;scroll-snap-align:start}.entry-grid{grid-template-columns:1fr}.section{margin-top:26px}.form-row{grid-template-columns:1fr}.section-heading{align-items:flex-start}.entry-card{min-height:176px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><div class="brandmark">裕</div><div class="brand-copy"><strong>裕信汽車｜服務部</strong><span>MANAGEMENT CENTER</span></div></div>
      <label class="search" aria-label="搜尋入口"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg><input id="searchInput" type="search" placeholder="搜尋儀表板或管理系統…"><span class="shortcut">/</span></label>
      <button class="manage-btn" id="addEntry">＋ 新增入口</button>
    </div>
  </header>
  <main>
    <section class="intro"><div><div class="eyebrow">SERVICE OPERATIONS</div><h1>服務部管理中心</h1><p>集中管理核心資訊，一站快速進入每日工作系統。</p></div><div class="overview-note"><b id="entryCount">0</b>個管理入口</div></section>
    <section class="categories" id="categories" aria-label="系統分類"></section>
    <section class="section" id="favoritesSection"><div class="section-heading"><div><h2>常用入口</h2><p>將每天使用的系統固定在這裡。</p></div></div><div class="entry-grid" id="favoritesGrid"></div></section>
    <section class="section" id="entriesSection"><div class="section-heading"><div><h2 id="entriesTitle">全部入口</h2><p id="entriesDesc">依分類瀏覽所有管理系統。</p></div><button class="text-btn" id="showAll">查看全部</button></div><div class="entry-grid" id="entryGrid"></div></section>
  </main>
  <dialog id="entryDialog">
    <div class="modal-head"><h2 id="modalTitle">新增入口</h2><button class="close" id="closeDialog" aria-label="關閉">×</button></div>
    <form class="form" id="entryForm">
      <input type="hidden" id="entryId">
      <div class="field"><label for="name">入口名稱</label><input id="name" required maxlength="40" placeholder="例：服務部營運儀表板"></div>
      <div class="field"><label for="url">網址</label><input id="url" type="url" placeholder="https://（可稍後設定）"></div>
      <div class="form-row"><div class="field"><label for="category">分類</label><select id="category" required></select></div><div class="field"><label for="order">排序</label><input id="order" type="number" min="1" value="99"></div></div>
      <div class="field"><label for="description">簡介</label><textarea id="description" maxlength="100" placeholder="說明這個入口的主要用途"></textarea></div>
      <div class="project-fields hidden" id="projectFields"><div class="form-row"><div class="field"><label for="owner">負責人</label><input id="owner" maxlength="30"></div><div class="field"><label for="due">完成期限</label><input id="due" type="date"></div></div><div class="form-row"><div class="field"><label for="status">狀態</label><select id="status"><option value="">未設定</option><option>進行中</option><option>待處理</option><option>已完成</option><option>逾期</option></select></div><div class="field"><label for="progress">進度（%）</label><input id="progress" type="number" min="0" max="100" placeholder="未設定"></div></div></div>
      <div class="modal-foot"><button type="button" class="btn danger hidden" id="deleteEntry">刪除入口</button><span></span><div class="right-actions"><button type="button" class="btn ghost" id="cancelDialog">取消</button><button type="submit" class="btn primary">儲存入口</button></div></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script>
  (()=>{
    const KEY='yuxin-service-portal-v1', FAV='yuxin-service-favorites-v1';
    const cats=[
      {id:'customer',title:'客戶經營',sub:'CDP＋CRM',desc:'客戶洞察、分群、商機與行銷管理',color:'#cf2d42',icon:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>'},
      {id:'operations',title:'營運績效',sub:'營運・業績・損益',desc:'進廠、營收、費用與各廠績效',color:'#35607d',icon:'<path d="M3 3v18h18"/><path d="m7 15 4-4 4 3 5-7"/>'},
      {id:'quality',title:'服務品質',sub:'CSI 客戶滿意度',desc:'滿意度趨勢、客戶回饋與改善追蹤',color:'#8a5962',icon:'<path d="m12 2 3 6 7 .9-5 4.8 1.4 7-6.4-3.4-6.4 3.4 1.4-7-5-4.8 7-.9z"/>'},
      {id:'talent',title:'人才管理',sub:'員工・績效・培育',desc:'人力配置、個人績效與教育訓練',color:'#4d6670',icon:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/><path d="M18 4l2-2M6 4 4 2"/>'},
      {id:'projects',title:'專案管理',sub:'服務部專案進度',desc:'掌握負責人、期限、進度與狀態',color:'#a63b42',icon:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 9h18M8 13h3M8 17h7"/>'}
    ];
    const seed=[
      {id:'team-archive',name:'服務部專案管理',url:'https://team-tracker-wheat.vercel.app/archive',category:'projects',description:'集中查看服務部專案與歷史紀錄。',order:1},
      {id:'service-dashboard',name:'服務營運儀表板',url:'https://maochi710918-gif.github.io/yuxin-service-dashboard/',category:'operations',description:'服務部營運狀況與核心指標總覽。',order:1},
      {id:'service-pl',name:'服務部損益儀表板',url:'https://maochi710918-gif.github.io/yuxin-service-pl-dashboard/',category:'operations',description:'檢視服務部營收、費用與損益表現。',order:2},
      {id:'yuxin-pl',name:'裕信損益分析',url:'https://maochi710918-gif.github.io/yuxin-pl-dashboard/',category:'operations',description:'跨單位損益與經營結果分析。',order:3},
      {id:'aftersales-performance',name:'售後服務績效',url:'https://es-aftersales-performance-1150807.esine-5833.chatgpt.site/',category:'operations',description:'售後服務績效與管理指標入口。',order:4},
      {id:'csi-dashboard',name:'CSI 服務品質儀表板',url:'https://maochi710918-g8if.github.io/csi-service-dashboard/',category:'quality',description:'追蹤客戶滿意度成績與趨勢。',order:1},
      {id:'capacity',name:'服務產能管理',url:'https://maochi710918-gif.github.io/ys-service-capacity-dashboard/app/index.html#/monthly',category:'operations',description:'檢視每月服務產能與資源運用。',order:5},
      {id:'seat-manager',name:'人力座位管理',url:'https://maochi710918-gif.github.io/seat-manager/',category:'talent',description:'管理座位配置與人力安排。',order:1}
    ];
    let entries=load(KEY,seed), favorites=new Set(load(FAV,['service-dashboard','service-pl','csi-dashboard'])), active='all', query='';
    const $=s=>document.querySelector(s), categories=$('#categories'), grid=$('#entryGrid'), favGrid=$('#favoritesGrid'), dlg=$('#entryDialog'), form=$('#entryForm');
    function load(k,f){try{const x=JSON.parse(localStorage.getItem(k));return Array.isArray(x)?x:f}catch{return f}}
    function save(){localStorage.setItem(KEY,JSON.stringify(entries));localStorage.setItem(FAV,JSON.stringify([...favorites]))}
    function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function icon(i){return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${i}</svg>`}
    function renderCategories(){categories.innerHTML=cats.map(c=>`<button class="category ${active===c.id?'active':''}" data-cat="${c.id}" style="--accent:${c.color}"><span class="icon">${icon(c.icon)}</span><h3>${c.title}<br>${c.sub}</h3><p>${c.desc}</p><span class="category-foot"><span class="count">${entries.filter(e=>e.category===c.id).length} 個入口</span><span class="enter">進入管理</span></span></button>`).join('')}
    function card(e){const c=cats.find(x=>x.id===e.category)||cats[0], hasUrl=!!e.url, project=e.category==='projects'&&(e.progress!==undefined&&e.progress!==''||e.status||e.owner||e.due);let meta='';if(project){const p=Math.max(0,Math.min(100,Number(e.progress)||0));meta=`<div class="project-meta"><div class="meta-row"><span>${e.owner?'負責人 '+esc(e.owner):e.due?'期限 '+esc(e.due):'專案資訊'}</span>${e.status?`<span class="status ${e.status==='已完成'?'done':e.status==='逾期'?'late':''}">${esc(e.status)}</span>`:''}</div>${e.progress!==undefined&&e.progress!==''?`<div class="progress" aria-label="進度 ${p}%"><span style="width:${p}%"></span></div>`:''}</div>`}return `<article class="entry-card" data-id="${esc(e.id)}"><div class="entry-top"><span class="entry-badge">${c.title}</span><button class="favorite ${favorites.has(e.id)?'on':''}" data-fav="${esc(e.id)}" aria-label="${favorites.has(e.id)?'取消收藏':'加入收藏'}">${icon('<path d="m12 2.5 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5-5.8-3.1-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9z"/>')}</button></div><h3>${esc(e.name)}</h3><p>${esc(e.description||'尚未填寫入口說明。')}</p>${meta}<div class="entry-actions">${hasUrl?`<a class="open-btn" href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">開啟儀表板</a>`:'<span class="open-btn pending">待設定</span>'}<button class="edit-mini" data-edit="${esc(e.id)}">編輯</button></div></article>`}
    function filtered(){return entries.filter(e=>(active==='all'||e.category===active)&&(!query||(e.name+' '+e.description).toLowerCase().includes(query))).sort((a,b)=>(a.order||99)-(b.order||99)||a.name.localeCompare(b.name,'zh-Hant'))}
    function render(){renderCategories();const items=filtered();grid.innerHTML=items.length?items.map(card).join(''):`<div class="empty"><strong>找不到符合的入口</strong>請調整搜尋內容或新增一個入口。</div>`;const favs=entries.filter(e=>favorites.has(e.id)&&(!query||(e.name+' '+e.description).toLowerCase().includes(query))).sort((a,b)=>(a.order||99)-(b.order||99));favGrid.innerHTML=favs.length?favs.map(card).join(''):`<div class="empty"><strong>尚無常用入口</strong>點選入口右上角的星號即可收藏。</div>`;$('#favoritesSection').classList.toggle('hidden',active!=='all'&& !query);$('#showAll').classList.toggle('hidden',active==='all');$('#entryCount').textContent=entries.length;const c=cats.find(x=>x.id===active);$('#entriesTitle').textContent=query?'搜尋結果':c?`${c.title}｜${c.sub}`:'全部入口';$('#entriesDesc').textContent=query?`符合「${query}」的入口`:c?c.desc:'依分類瀏覽所有管理系統。'}
    function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
    function openDialog(id){form.reset();$('#order').value=99;$('#entryId').value='';$('#modalTitle').textContent='新增入口';$('#deleteEntry').classList.add('hidden');if(id){const e=entries.find(x=>x.id===id);if(!e)return;$('#entryId').value=e.id;$('#name').value=e.name;$('#url').value=e.url||'';$('#category').value=e.category;$('#order').value=e.order||99;$('#description').value=e.description||'';$('#owner').value=e.owner||'';$('#due').value=e.due||'';$('#status').value=e.status||'';$('#progress').value=e.progress??'';$('#modalTitle').textContent='編輯入口';$('#deleteEntry').classList.remove('hidden')}toggleProject();dlg.showModal()}
    function toggleProject(){$('#projectFields').classList.toggle('hidden',$('#category').value!=='projects')}
    categories.addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;active=b.dataset.cat;render();$('#entriesSection').scrollIntoView({behavior:'smooth',block:'start'})});
    document.addEventListener('click',e=>{const f=e.target.closest('[data-fav]');if(f){const id=f.dataset.fav;favorites.has(id)?favorites.delete(id):favorites.add(id);save();render();toast(favorites.has(id)?'已加入常用入口':'已取消收藏')}const edit=e.target.closest('[data-edit]');if(edit)openDialog(edit.dataset.edit)});
    $('#showAll').onclick=()=>{active='all';render()};$('#addEntry').onclick=()=>openDialog();$('#closeDialog').onclick=$('#cancelDialog').onclick=()=>dlg.close();$('#category').onchange=toggleProject;
    $('#searchInput').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();active='all';render()});document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();$('#searchInput').focus()}if(e.key==='Escape'&&dlg.open)dlg.close()});
    form.addEventListener('submit',e=>{e.preventDefault();const id=$('#entryId').value||`entry-${Date.now()}`;const old=entries.find(x=>x.id===id)||{};let url=$('#url').value.trim();const item={...old,id,name:$('#name').value.trim(),url,category:$('#category').value,order:Number($('#order').value)||99,description:$('#description').value.trim()};if(item.category==='projects'){item.owner=$('#owner').value.trim();item.due=$('#due').value;item.status=$('#status').value;item.progress=$('#progress').value===''?'':Number($('#progress').value)}else{delete item.owner;delete item.due;delete item.status;delete item.progress}const i=entries.findIndex(x=>x.id===id);i>=0?entries[i]=item:entries.push(item);save();dlg.close();render();toast(i>=0?'入口已更新':'入口已新增')});
    $('#deleteEntry').onclick=()=>{const id=$('#entryId').value;if(!id||!confirm('確定要刪除這個入口嗎？'))return;entries=entries.filter(x=>x.id!==id);favorites.delete(id);save();dlg.close();render();toast('入口已刪除')};
    $('#category').innerHTML=cats.map(c=>`<option value="${c.id}">${c.title}｜${c.sub}</option>`).join('');
    function registerTools(){const mc=document.modelContext;if(!mc?.registerTool)return;const tools=[{name:'list_management_entries',title:'列出管理入口',description:'列出目前平台上的管理系統入口，可依分類篩選。',inputSchema:{type:'object',properties:{category:{type:'string',enum:['all',...cats.map(c=>c.id)]}},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute:({category='all'}={})=>entries.filter(e=>category==='all'||e.category===category).map(({id,name,url,category,description})=>({id,name,url:url||null,category,description}))},{name:'add_management_entry',title:'新增管理入口',description:'新增一個管理系統入口並立即顯示在平台上。',inputSchema:{type:'object',properties:{name:{type:'string'},url:{type:'string'},category:{type:'string',enum:cats.map(c=>c.id)},description:{type:'string'}},required:['name','category'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:(x)=>{if(!x.name||!cats.some(c=>c.id===x.category))throw new Error('名稱與有效分類為必填');const item={id:`entry-${Date.now()}`,name:x.name.trim(),url:(x.url||'').trim(),category:x.category,description:(x.description||'').trim(),order:99};entries.push(item);save();render();return {id:item.id,status:'created'}}}];tools.forEach(t=>{try{Promise.resolve(mc.registerTool(t)).catch(()=>{})}catch{}})}
    render();registerTools();
  })();
  </script>
</body>
</html>
